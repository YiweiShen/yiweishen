# https://github.com/czl9707/gh-space-shooter
name: Update Space Shooter Game

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Space Shooter GIF Generator
        uses: YiweiShen/gh-space-shooter@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
