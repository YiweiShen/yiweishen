# https://github.com/czl9707/gh-space-shooter
name: Update Space Shooter Game

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate game GIF
        uses: czl9707/gh-space-shooter@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'game.gif'
          strategy: 'random'

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Optimize GIF size
        run: |
          ffmpeg -i game.gif \
            -vf "fps=12,scale=480:-1:flags=lanczos,palettegen" palette.png

          ffmpeg -i game.gif -i palette.png \
            -vf "fps=12,scale=480:-1:flags=lanczos[x];[x][1:v]paletteuse" \
            game_optimized.gif

          mv game_optimized.gif game.gif
          rm palette.png

      - name: Commit optimized GIF
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add game.gif
          git commit -m "Update optimized space shooter GIF" || exit 0
          git push
