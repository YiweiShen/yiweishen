# https://github.com/czl9707/gh-space-shooter
name: Update Space Shooter Game

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Space Shooter GIF Generator
        uses: YiweiShen/gh-space-shooter@v1.0.5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: gh-contribution-grid.gif
          commit: false

      - name: Move GIF to dist folder
        run: |
          mkdir -p dist
          mv gh-contribution-grid.gif dist/

      # push the content of <build_dir> to a branch
      # the content will be available at https://raw.githubusercontent.com/<github_user>/<repository>/<target_branch>/<file> , or as github page
      - name: push gh-contribution-grid.gif to the output branch
        uses: crazy-max/ghaction-github-pages@v2.5.0
        with:
          target_branch: space-shooter
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
